<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Americano 12 Pairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style id="app-style">
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: scoreboard header, sticky tab bar, then one working panel (standings / rounds / pairs) */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --line:#dde3ec; --fg:#14213a; --muted:#5d6b82;
  --court:#1d5aa6; --court-ink:#ffffff; --ball:#c9d92b; --ball-ink:#1b2400;
  --win:#1f8a52; --loss:#b4423a; --field:#f7f9fc; --sideA:#d6e4f6; --sideB:#eef3c4; --sideBInk:#6b7a00;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surface:#151e2d; --line:#26324a; --fg:#e7ecf5; --muted:#93a1b8;
  --court:#3b7dd8; --court-ink:#ffffff; --ball:#d3e23a; --ball-ink:#1b2400;
  --win:#4cc483; --loss:#ee7a70; --field:#0f1725; --sideA:#1d3456; --sideB:#3a4214; --sideBInk:#d3e23a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#151e2d; --line:#26324a; --fg:#e7ecf5; --muted:#93a1b8;
  --court:#3b7dd8; --court-ink:#ffffff; --ball:#d3e23a; --ball-ink:#1b2400;
  --win:#4cc483; --loss:#ee7a70; --field:#0f1725; --sideA:#1d3456; --sideB:#3a4214; --sideBInk:#d3e23a; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.hero{background:var(--court);color:var(--court-ink);margin-inline:-16px;padding:22px 16px 18px;position:relative;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--ball)}
.hero-in{max-width:828px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:2px 0 0;text-wrap:balance;letter-spacing:.01em}
.progress{font-family:var(--display);font-size:15px;letter-spacing:.04em;text-align:right}
.progress b{font-size:28px;font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px;width:180px;max-width:100%;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ball)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{font:600 15px var(--body);border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px}
.note{color:var(--muted);font-size:13px}
.ro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted)}
/* standings */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.name{white-space:normal;min-width:140px;font-weight:500}
td.pos{font-family:var(--display);font-size:18px;color:var(--muted);width:36px;text-align:center}
tr.top1 td.pos{color:var(--ball-ink);background:var(--ball)}
td.pts{font-family:var(--display);font-size:20px;font-weight:600}
.pos-diff{color:var(--win)} .neg-diff{color:var(--loss)}
/* rounds */
.round-pick{display:flex;flex-wrap:wrap;gap:6px}
.round-pick button{font:600 14px var(--display);letter-spacing:.03em;min-width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;position:relative}
.round-pick button.done{border-color:var(--win)}
.round-pick button.done::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--win)}
.round-pick button[aria-pressed="true"]{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.round-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.round-head h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.match .mno{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.side{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.side .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.side.won .nm{color:var(--win)}
.side.won .sc{color:var(--win)}
.sc{font-family:var(--display);font-size:24px;font-weight:600;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.sc.empty{color:var(--line)}
input.sc{width:56px;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--fg);padding:0;-moz-appearance:textfield}
input.sc::-webkit-outer-spin-button,input.sc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sep{height:1px;background:var(--line)}
.clear{align-self:flex-end;font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline}
.nx{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}
.sd{display:inline-block;font:600 11px var(--display);color:var(--court);border:1px solid var(--court);border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:1px}
.match .mno{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;text-transform:none;color:var(--fg)}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rule summary{cursor:pointer;font-weight:600}
.rule-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:12px 0 4px;text-align:center;font-size:13px}
.rule-grid .rn{font:600 16px var(--display);background:var(--court);color:var(--court-ink);border-radius:6px;padding:6px 0}
.rule-grid .rc{color:var(--muted);white-space:nowrap}
.rule-grid b{color:var(--fg)}
.rule-list{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.svg-wrap{overflow-x:auto;margin:12px 0 4px}
svg.rot{width:100%;min-width:340px;max-width:640px;height:auto;display:block;font-family:var(--display)}
svg.rot .ha{fill:var(--sideA)} svg.rot .hb{fill:var(--sideB)}
svg.rot .net{stroke:var(--fg);stroke-width:3;stroke-dasharray:4 3}
svg.rot .sl{font-size:26px;font-weight:700;fill:var(--fg);text-anchor:middle;opacity:.5}
svg.rot .cl{font-size:22px;font-weight:600;fill:var(--fg);text-anchor:middle}
svg.rot .tiny{font-family:var(--body);font-size:17px;fill:var(--muted);text-anchor:middle}
svg.rot .arA,svg.rot .arB{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
svg.rot .arA{stroke:var(--court)} svg.rot .arB{stroke:var(--sideBInk)}
svg.rot .loop{stroke-dasharray:7 6}
svg.rot .ah{fill:var(--fg)}
.sidecap{margin:4px 0 0}
/* pairs & settings */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pairs label{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;min-width:0}
.pairs .n{font-family:var(--display);color:var(--muted);text-align:right}
input.txt,select{font:15px var(--body);height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:0 10px;width:100%;min-width:0;box-sizing:border-box}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:6px 0 0;letter-spacing:.02em}
/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--fg);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.savebar-in{max-width:828px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.savebar button{font:600 15px var(--body);border:0;border-radius:999px;padding:10px 20px;cursor:pointer}
.btn-save{background:var(--ball);color:var(--ball-ink)}
.btn-undo{background:transparent;color:var(--bg);text-decoration:underline}
.btn-undo:disabled,.btn-save:disabled{opacity:.5;cursor:default}
.msg{font-size:14px}
/* organizer login */
.foot{margin-top:28px}
.foot summary{cursor:pointer}
.pinrow{display:flex;gap:8px;margin-top:8px;max-width:320px}
.pinrow .btn-save{border:0;border-radius:999px;padding:0 18px;font:600 15px var(--body);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>

</head>
<body>
<div class="wrap">
  <header class="hero"><div class="hero-in">
    <div><div class="eyebrow" id="sub">Padel · team americano</div><h1 id="ttl">Americano</h1></div>
    <div class="progress" id="prog"></div>
  </div></header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-table" data-tab="table" aria-selected="true">Standings</button>
    <button role="tab" id="tab-rounds" data-tab="rounds" aria-selected="false">Rounds</button>
    <button role="tab" id="tab-pairs" data-tab="pairs" aria-selected="false">Pairs</button>
  </nav>
  <main id="view" class="panel"></main>
  <footer id="foot" class="foot"></footer>
</div>
<div class="savebar" id="savebar" hidden><div class="savebar-in">
  <span class="msg" id="savemsg">You have unsaved changes</span>
  <span><button class="btn-undo" id="btn-undo">Discard</button> <button class="btn-save" id="btn-save">Save</button></span>
</div></div>

<script type="application/json" id="state">{"v":1,"title":"Americano · Saturday 3 October","sub":"Padel · team americano · 12 pairs","total":null,"sort":"points","pairs":["Pair 1","Pair 2","Pair 3","Pair 4","Pair 5","Pair 6","Pair 7","Pair 8","Pair 9","Pair 10","Pair 11","Pair 12"],"scores":{}}</script>
<script id="app-js">
(function(){
var saved = JSON.parse(document.getElementById('state').textContent);
var S = JSON.parse(JSON.stringify(saved));
var N = S.pairs.length; // 12
var canEdit = false, art = null, dirty = false, busy = false;
var tab = 'table', round = 0;
try { var t = sessionStorage.getItem('am-tab'); if (t) tab = t; var r = sessionStorage.getItem('am-round'); if (r) round = +r; } catch(e){}

// Round-robin schedule (circle method): 11 rounds x 6 matches, every pair meets every other once
function schedule(n){
  var ids = []; for (var i=0;i<n;i++) ids.push(i);
  var rounds = [];
  for (var r=0;r<n-1;r++){
    var ms = [];
    for (var k=0;k<n/2;k++){
      var a = ids[k], b = ids[n-1-k];
      ms.push([a,b]); // court k+1: side A = a, side B = b
    }
    rounds.push(ms);
    ids = [ids[0]].concat([ids[n-1]], ids.slice(1,n-1));
  }
  return rounds;
}
var R = schedule(N);
function courts(){ var c = (S.courts && S.courts.length===6) ? S.courts : ['1','2','3','4','5','6']; return c.map(function(x,i){ return String(x||'').trim() || String(i+1); }); }
function sideA(){ return (S.sideA && S.sideA.trim()) || 'the far side of the net'; }
function rotationSvg(C){
  var W=96, G=10, X0=24, top=58, h=190, mid=top+h/2, o='';
  function cx(k){ return X0+k*(W+G); }
  o += '<svg class="rot" viewBox="0 0 660 320" role="img" aria-label="Rotation: Side A moves one court up, Side B one court down, Court '+esc(C[0])+' Side A stays">';
  o += '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>';
  for (var k=0;k<6;k++){
    var x=cx(k);
    o += '<rect x="'+x+'" y="'+top+'" width="'+W+'" height="'+(h/2)+'" rx="6" class="ha"/>';
    o += '<rect x="'+x+'" y="'+mid+'" width="'+W+'" height="'+(h/2)+'" rx="6" class="hb"/>';
    o += '<line x1="'+(x-3)+'" y1="'+mid+'" x2="'+(x+W+3)+'" y2="'+mid+'" class="net"/>';
    o += '<text x="'+(x+W/2)+'" y="'+(top+h/4+8)+'" class="sl">A</text>';
    o += '<text x="'+(x+W/2)+'" y="'+(mid+h/4+8)+'" class="sl">B</text>';
    o += '<text x="'+(x+W/2)+'" y="'+(top+h+30)+'" class="cl">'+esc(C[k])+'</text>';
  }
  o += '<text x="'+(cx(0)+W/2)+'" y="'+(top+h/4+34)+'" class="tiny">stays</text>';
  for (var k=1;k<5;k++) o += '<path d="M'+(cx(k)+W/2+16)+' '+(top+h/4)+' L'+(cx(k+1)+W/2-16)+' '+(top+h/4)+'" class="arA" marker-end="url(#ah)"/>';
  o += '<path d="M'+(cx(5)+W-14)+' '+(top+h/4+16)+' L'+(cx(5)+W-14)+' '+(mid+h/4-14)+'" class="arA" marker-end="url(#ah)"/>';
  for (var k=5;k>=1;k--) o += '<path d="M'+(cx(k)+W/2-16)+' '+(mid+h/4)+' L'+(cx(k-1)+W/2+16)+' '+(mid+h/4)+'" class="arB" marker-end="url(#ah)"/>';
  var lx=X0-14, ty=top-22;
  o += '<path d="M'+(cx(0)+W/2-18)+' '+(mid+h/4)+' L'+lx+' '+(mid+h/4)+' L'+lx+' '+ty+' L'+(cx(1)+W/2)+' '+ty+' L'+(cx(1)+W/2)+' '+(top+h/4-18)+'" class="arB loop" marker-end="url(#ah)"/>';
  o += '<text x="330" y="'+(top+h+58)+'" class="tiny">Court numbers</text>';
  o += '</svg>';
  return o;
}
function cn(k){ return 'Court '+courts()[k]; }
// where a pair plays in a round: {court index, side 0=A 1=B}
function posIn(r, t){ for (var k=0;k<R[r].length;k++){ var m=R[r][k]; if (m[0]===t) return {k:k,side:0}; if (m[1]===t) return {k:k,side:1}; } return null; }
function key(a,b){ return a<b ? a+'-'+b : b+'-'+a; }
function getScore(a,b){ var s = S.scores[key(a,b)]; if (!s) return null; return a<b ? s : [s[1],s[0]]; }
function setScore(a,b,x,y){
  var k = key(a,b);
  if (x===null && y===null){ delete S.scores[k]; return; }
  S.scores[k] = a<b ? [x,y] : [y,x];
}
function complete(s){ return s && s[0]!==null && s[1]!==null && s[0]!=='' && s[1]!==''; }
function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nm(i){ return S.pairs[i] && S.pairs[i].trim() ? S.pairs[i] : 'Pair '+(i+1); }

function standings(){
  var rows = S.pairs.map(function(_,i){ return {i:i,p:0,w:0,d:0,l:0,pf:0,pa:0}; });
  R.forEach(function(ms){ ms.forEach(function(m){
    var s = getScore(m[0],m[1]); if (!complete(s)) return;
    var A = rows[m[0]], B = rows[m[1]], x=+s[0], y=+s[1];
    A.p++; B.p++; A.pf+=x; A.pa+=y; B.pf+=y; B.pa+=x;
    if (x>y){A.w++;B.l++;} else if (y>x){B.w++;A.l++;} else {A.d++;B.d++;}
  }); });
  rows.forEach(function(r){ r.diff = r.pf - r.pa; });
  rows.sort(S.sort==='wins'
    ? function(a,b){ return b.w-a.w || b.diff-a.diff || b.pf-a.pf || a.i-b.i; }
    : function(a,b){ return b.pf-a.pf || b.w-a.w || b.diff-a.diff || a.i-b.i; });
  return rows;
}
function playedCount(){ var c=0; R.forEach(function(ms){ ms.forEach(function(m){ if (complete(getScore(m[0],m[1]))) c++; }); }); return c; }
function roundDone(r){ return R[r].every(function(m){ return complete(getScore(m[0],m[1])); }); }

function renderHead(){
  document.getElementById('ttl').textContent = S.title || 'Americano';
  document.getElementById('sub').textContent = S.sub || '';
  var total = R.length*R[0].length, c = playedCount();
  document.getElementById('prog').innerHTML = '<div><b>'+c+'</b> / '+total+' matches</div><div class="bar"><i style="width:'+(c/total*100)+'%"></i></div>';
  document.querySelectorAll('nav.tabs button').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab===tab ? 'true':'false'); });
}

function renderTable(){
  var rows = standings();
  var h = '';
  if (!canEdit) h += '';
  h += '<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="l">Pair</th><th title="Matches played">P</th><th title="Wins">W</th><th title="Draws">D</th><th title="Losses">L</th><th title="Points won">For</th><th title="Points lost">Agst</th><th title="Difference">±</th></tr></thead><tbody>';
  rows.forEach(function(r,idx){
    var ptsCol = S.sort==='wins' ? 'w' : 'pf';
    h += '<tr class="'+(idx===0 && r.p>0 ? 'top1':'')+'"><td class="pos">'+(idx+1)+'</td><td class="l name">'+esc(nm(r.i))+'</td><td>'+r.p+'</td>'
      +'<td'+(ptsCol==='w'?' class="pts"':'')+'>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td>'
      +'<td'+(ptsCol==='pf'?' class="pts"':'')+'>'+r.pf+'</td><td>'+r.pa+'</td>'
      +'<td class="'+(r.diff>0?'pos-diff':r.diff<0?'neg-diff':'')+'">'+(r.diff>0?'+':'')+r.diff+'</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<p class="note">'+(S.sort==='wins' ? 'Ranked by wins, then point difference, then points won.' : 'Ranked by total points won (classic americano), then wins, then difference.')+' Every pair plays 11 matches, one against each other pair.</p>';
  return h;
}

function renderRounds(){
  var h = '<div class="round-pick" role="group" aria-label="Round">';
  for (var r=0;r<R.length;r++) h += '<button data-round="'+r+'" class="'+(roundDone(r)?'done':'')+'" aria-pressed="'+(r===round)+'">'+(r+1)+'</button>';
  h += '</div>';
  h += '<div class="round-head"><h2>Round '+(round+1)+' of '+R.length+'</h2>'+(S.total ? '<span class="note">Matches to '+S.total+' points total</span>' : '')+'</div>';
  var C = courts();
  h += '<details class="rule"'+(round===0?' open':'')+'><summary>How pairs move after each round</summary>'
    + '<div class="svg-wrap">'+rotationSvg(C)+'</div>'
    + '<p class="note sidecap"><b>Side A</b> = '+esc(sideA())+'. <b>Side B</b> = the other side of the net.</p>'
    + '<ul class="rule-list">'
    + '<li>The pair on Court '+esc(C[0])+', Side A stays put for the whole tournament.</li>'
    + '<li>All other Side A pairs move one court up: '+esc(C[1])+' → '+esc(C[2])+' … '+esc(C[4])+' → '+esc(C[5])+'. From Court '+esc(C[5])+', Side A crosses the net to Side B of the same court.</li>'
    + '<li>Side B pairs move one court down: '+esc(C[5])+' → '+esc(C[4])+' … '+esc(C[1])+' → '+esc(C[0])+'. From Court '+esc(C[0])+', Side B moves to Side A of Court '+esc(C[1])+'.</li>'
    + '<li>Under each pair you can see where it plays next round.</li>'
    + '</ul></details>';
  h += '<div class="matches">';
  R[round].forEach(function(m,k){
    var s = getScore(m[0],m[1]) || [null,null];
    var done = complete(s), wa = done && +s[0]>+s[1], wb = done && +s[1]>+s[0];
    h += '<div class="match"><div class="mno">'+esc(cn(k))+'</div>';
    [0,1].forEach(function(side){
      var won = side===0 ? wa : wb, v = s[side];
      var nx = round < R.length-1 ? posIn(round+1, m[side]) : null;
      var hint = nx ? '<span class="nx">'+(nx.k===k && nx.side===side ? 'stays here' : 'next: '+esc(cn(nx.k))+', Side '+(nx.side?'B':'A'))+'</span>' : '';
      h += '<div class="side'+(won?' won':'')+'"><span class="nm"><span class="sd">'+(side?'B':'A')+'</span>'+esc(nm(m[side]))+hint+'</span>';
      if (canEdit) h += '<input class="sc" type="number" inputmode="numeric" min="0" max="99" id="s-'+key(m[0],m[1])+'-'+side+'" data-a="'+m[0]+'" data-b="'+m[1]+'" data-side="'+side+'" value="'+(v===null||v===undefined?'':v)+'" aria-label="Score: '+esc(nm(m[side]))+'">';
      else h += '<span class="sc'+(v===null||v===undefined||v===''?' empty':'')+'">'+(v===null||v===undefined||v===''?'–':v)+'</span>';
      h += '</div>';
      if (side===0) h += '<div class="sep"></div>';
    });
    if (canEdit && (s[0]!==null || s[1]!==null)) h += '<button class="clear" data-clear="'+m[0]+'-'+m[1]+'">Clear</button>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderPairs(){
  var h = '';
  if (!canEdit){
    h += '<div class="pairs">';
    S.pairs.forEach(function(_,i){ h += '<label><span class="n">'+(i+1)+'</span><span>'+esc(nm(i))+'</span></label>'; });
    return h + '</div>';
  }
  h += '<h3>Pairs</h3><p class="note">Enter each pair, e.g. “Sergei / Alex”. The pair order sets the schedule, so only change the names.</p><div class="pairs">';
  S.pairs.forEach(function(p,i){ h += '<label><span class="n">'+(i+1)+'</span><input class="txt" id="pair-'+i+'" data-pair="'+i+'" value="'+esc(p)+'" maxlength="60"></label>'; });
  h += '</div><h3>Tournament</h3><div class="settings">'
    + '<label>Title<input class="txt" id="set-title" data-set="title" value="'+esc(S.title||'')+'" maxlength="80"></label>'
    + '<label>Subtitle<input class="txt" id="set-sub" data-set="sub" value="'+esc(S.sub||'')+'" maxlength="80"></label>'
    + '<label>Courts in order, comma-separated<input class="txt" id="set-courts" data-set="courts" value="'+esc(courts().join(', '))+'" maxlength="80"></label>'
    + '<label>What is Side A at the venue<input class="txt" id="set-sideA" data-set="sideA" value="'+esc(sideA())+'" maxlength="60"></label>'
    + '<label>Total points per match<input class="txt" id="set-total" data-set="total" type="number" inputmode="numeric" min="1" max="99" placeholder="not set" value="'+(S.total||'')+'"></label>'
    + '<label>Rank by<select id="set-sort" data-set="sort"><option value="points"'+(S.sort!=='wins'?' selected':'')+'>Total points</option><option value="wins"'+(S.sort==='wins'?' selected':'')+'>Wins</option></select></label>'
    + '</div><p class="note">List the courts in the order they stand at the venue: pairs move to the neighbouring court in this order. Exactly 6 courts.</p><p class="note">If you set total points (e.g. 24), entering one pair’s score fills in the other automatically: 15 → 9.</p>';
  return h;
}

function render(){
  renderHead();
  var v = document.getElementById('view');
  var h = '';
  h += tab==='rounds' ? renderRounds() : tab==='pairs' ? renderPairs() : renderTable();
  v.innerHTML = h;
  document.getElementById('savebar').hidden = !(canEdit && dirty);
}
function touch(){ dirty = JSON.stringify(S)!==JSON.stringify(saved); document.getElementById('savebar').hidden = !(canEdit && dirty); document.getElementById('savemsg').textContent = 'You have unsaved changes'; renderHead(); }

document.querySelector('nav.tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; try{ sessionStorage.setItem('am-tab', tab); }catch(_){} render();
});
document.getElementById('view').addEventListener('click', function(e){
  var b = e.target.closest('[data-round]');
  if (b){ round = +b.dataset.round; try{ sessionStorage.setItem('am-round', round); }catch(_){} render(); return; }
  var c = e.target.closest('[data-clear]');
  if (c){ var p = c.dataset.clear.split('-'); setScore(+p[0],+p[1],null,null); touch(); render(); }
});
function num(v){ if (v===''||v===null) return null; var n = Math.max(0, Math.min(99, parseInt(v,10))); return isNaN(n) ? null : n; }
document.getElementById('view').addEventListener('input', function(e){
  var el = e.target;
  if (el.dataset.pair !== undefined){ S.pairs[+el.dataset.pair] = el.value; touch(); return; }
  if (el.dataset.set){
    var k = el.dataset.set;
    if (k==='courts'){ var parts = el.value.split(',').map(function(x){ return x.trim().slice(0,12); }); if (parts.length!==6 || parts.some(function(x){ return !x; })) return; S.courts = parts; touch(); return; }
    S[k] = k==='total' ? (num(el.value)||null) : el.value;
    touch(); if (k==='sort') return; return;
  }
  if (el.dataset.side !== undefined){
    var a = +el.dataset.a, b = +el.dataset.b, side = +el.dataset.side;
    var s = getScore(a,b) || [null,null];
    s = s.slice(); s[side] = num(el.value);
    var other = 1-side, oEl = document.getElementById('s-'+key(a,b)+'-'+other);
    if (S.total && s[side]!==null && s[side]<=S.total && (oEl.value==='' || oEl.dataset.auto==='1')){
      s[other] = S.total - s[side]; oEl.value = s[other]; oEl.dataset.auto = '1';
    }
    el.dataset.auto = '';
    setScore(a,b,s[0],s[1]); touch();
  }
});
document.getElementById('view').addEventListener('change', function(e){
  if (e.target.dataset.set==='sort'){ S.sort = e.target.value; touch(); }
  if (e.target.dataset.side !== undefined) render();
});
document.getElementById('btn-undo').addEventListener('click', function(){
  S = JSON.parse(JSON.stringify(saved)); dirty=false; render();
});


var pin = null; try { pin = localStorage.getItem('am-pin'); } catch(_){}
function setMsg(t){ document.getElementById('savemsg').textContent = t; }
async function load(){
  try {
    var r = await fetch('/api/state', {cache:'no-store'});
    if (!r.ok) return;
    var d = await r.json();
    if (dirty) return;
    if (JSON.stringify(d)===JSON.stringify(saved)) return;
    saved = d; S = JSON.parse(JSON.stringify(d));
    var a = document.activeElement; if (a && a.closest && a.closest('#view') && a.tagName==='INPUT') return;
    render();
  } catch(e){}
}
async function login(p){
  var r = await fetch('/api/login', {method:'POST', headers:{'x-pin':p}});
  return r.ok;
}
document.getElementById('btn-save').addEventListener('click', async function(){
  if (busy || !pin) return;
  busy = true; var btn = this; btn.disabled = true; setMsg('Saving…');
  try {
    var r = await fetch('/api/state', {method:'POST', headers:{'content-type':'application/json','x-pin':pin}, body: JSON.stringify({base: saved, next: S})});
    if (r.status===401){ canEdit=false; pin=null; try{localStorage.removeItem('am-pin');}catch(_){} dirty=false; S=JSON.parse(JSON.stringify(saved)); render(); renderFoot(); return; }
    if (!r.ok) throw new Error();
    var fresh = await r.json();
    saved = fresh; S = JSON.parse(JSON.stringify(fresh)); dirty = false; setMsg('Saved');
    document.getElementById('savebar').hidden = true; render();
  } catch(e){ setMsg('Could not save. Check your connection and tap Save again.'); }
  finally { busy = false; btn.disabled = false; }
});
function renderFoot(){
  var f = document.getElementById('foot');
  if (canEdit){ f.innerHTML = '<button class="clear" id="logout">Leave organizer mode</button>'; return; }
  f.innerHTML = '<details><summary class="note">I’m an organizer</summary><form id="pinform" class="pinrow"><input class="txt" id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN"><button class="btn-save" type="submit">Log in</button></form><p class="note" id="pinerr"></p></details>';
}
document.getElementById('foot').addEventListener('submit', async function(e){
  e.preventDefault();
  var p = document.getElementById('pin-input').value.trim(); if (!p) return;
  if (await login(p)){ pin=p; try{localStorage.setItem('am-pin',p);}catch(_){} canEdit=true; render(); renderFoot(); }
  else document.getElementById('pinerr').textContent = 'Wrong PIN.';
});
document.getElementById('foot').addEventListener('click', function(e){
  if (e.target.id==='logout'){ pin=null; try{localStorage.removeItem('am-pin');}catch(_){} canEdit=false; dirty=false; S=JSON.parse(JSON.stringify(saved)); render(); renderFoot(); }
});

render(); renderFoot(); load();
setInterval(load, 15000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
if (pin) login(pin).then(function(ok){ if (ok){ canEdit=true; render(); renderFoot(); } else { pin=null; try{localStorage.removeItem('am-pin');}catch(_){} } });
})();
</script>
</body>
</html>
